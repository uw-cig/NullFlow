experiment_name: nullflow_ffhq_infer
output_dir: outputs/nullflow_ffhq

training:
  load_from: ""
  batch_size: 256
  minibatch_size: 16
  learning_rate: 0.0001
  adam_beta2: 0.95
  distributed: false
  project_loss_to_measurement_space: false
  lpips: true
  lpips_lambda: 0.4
  convnext: true
  convnext_lambda: 0.1
  perceptual_max_t: 0.8

data:
  data_root: ""
  train_split_start: 1000
  train_split_end: 70000
  val_split_start: 500
  val_split_end: 1000
  test_split_start: 0
  test_split_end: 500
  resized_cache_dir: data/ffhq_256_cache
  inpainting:
    center_mask_size: 128

model:
  unet_num_res_blocks: 1
  unet_attention_resolutions: "16"
  unet_num_heads: 4
  unet_num_head_channels: 64

evaluation:
  val_batch_size: 32
  fixed_noise_seed: 42

wandb:
  enabled: false
  project: ""
  entity: ""
  group: ""
  run_name: ""
  tags: []
  mode: disabled
  log_images: false
